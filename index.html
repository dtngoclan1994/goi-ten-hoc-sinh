<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gọi Tên Học Sinh Ngẫu Nhất</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header { margin-bottom: 20px; text-align: center; }
    h1 { color: var(--primary); font-size: 2rem; margin-bottom: 8px; }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }

    @media (min-width: 768px) {
      .container { flex-direction: row; }
    }

    .panel {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      flex: 1;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      resize: vertical;
      font-size: 1rem;
      margin-bottom: 10px;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn:hover { background-color: var(--primary-hover); }

    .wheel-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .wheel-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin-bottom: 20px;
    }

    canvas { width: 100%; height: 100%; border-radius: 50%; }

    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #ef4444;
      z-index: 10;
    }

    .result-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .winner-name {
      font-size: 2.5rem;
      color: var(--primary);
      margin: 15px 0;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎲 Vòng Quay Gọi Tên Ngẫu Nhất</h1>
    <p>Nhập danh sách học sinh và bấm quay để chọn!</p>
  </header>

  <div class="container">
    <div class="panel">
      <h3>Danh Sách Học Sinh</h3>
      <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 8px;">Nhập mỗi tên trên một dòng:</p>
      <textarea id="nameInput" placeholder="Nguyễn Văn A&#10;Trần Thị B&#10;Lê Văn C"></textarea>
      <button class="btn" onclick="updateNames()">Cập Nhật Danh Sách</button>
    </div>

    <div class="panel wheel-panel">
      <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
      </div>
      <button class="btn" id="spinBtn" onclick="spin()">QUAY NGAY</button>
    </div>
  </div>

  <div class="result-modal" id="resultModal">
    <div class="modal-content">
      <h2>🎉 Người May Mắn Là 🎉</h2>
      <div class="winner-name" id="winnerName">...</div>
      <button class="btn" onclick="closeModal()">Đóng</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    let names = ["Nguyễn Văn A", "Trần Thị B", "Lê Văn C", "Phạm Văn D", "Hoàng Thị E"];

    const colors = ['#f87171', '#fbbf24', '#34d399', '#60a5fa', '#a78bfa', '#f472b6', '#fb923c'];
    let startAngle = 0;
    let isSpinning = false;

    // Phát âm thanh bằng Web Audio API (Không cần dùng file bên ngoài)
    function playClickSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function drawWheel() {
      const numOptions = names.length;
      if (numOptions === 0) {
        ctx.clearRect(0, 0, 300, 300);
        return;
      }

      const arcSize = (2 * Math.PI) / numOptions;
      ctx.clearRect(0, 0, 300, 300);

      for (let i = 0; i < numOptions; i++) {
        const angle = startAngle + i * arcSize;
        ctx.fillStyle = colors[i % colors.length];
        ctx.beginPath();
        ctx.arc(150, 150, 140, angle, angle + arcSize, false);
        ctx.lineTo(150, 150);
        ctx.fill();

        // Vẽ tên
        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px sans-serif";
        ctx.translate(150 + Math.cos(angle + arcSize / 2) * 90, 150 + Math.sin(angle + arcSize / 2) * 90);
        ctx.rotate(angle + arcSize / 2 + Math.PI / 2);
        const text = names[i].length > 12 ? names[i].substring(0, 10) + "..." : names[i];
        ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
        ctx.restore();
      }
    }

    function updateNames() {
      const input = document.getElementById('nameInput').value.trim();
      if (input) {
        names = input.split('\n').filter(name => name.trim() !== "");
        drawWheel();
      }
    }

    function spin() {
      if (isSpinning || names.length === 0) return;
      isSpinning = true;

      const spinAngle = Math.random() * 2000 + 2000;
      const duration = 4000;
      let start = null;

      function animate(timestamp) {
        if (!start) start = timestamp;
        const progress = Math.min((timestamp - start) / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        
        startAngle = (easeOut * spinAngle * Math.PI / 180) % (2 * Math.PI);
        drawWheel();
        playClickSound();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          showWinner();
        }
      }

      requestAnimationFrame(animate);
    }

    function showWinner() {
      const degrees = (startAngle * 180 / Math.PI) % 360;
      const arcDegrees = 360 / names.length;
      // Góc 270 độ ứng với vị trí mũi tên ở trên cùng
      const winnerIndex = Math.floor((360 - degrees + 270) % 360 / arcDegrees);

      const winner = names[winnerIndex];
      document.getElementById('winnerName').innerText = winner;
      document.getElementById('resultModal').style.display = 'flex';

      // Hiệu ứng pháo hoa
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }

    function closeModal() {
      document.getElementById('resultModal').style.display = 'none';
    }

    // Khởi tạo mặc định
    document.getElementById('nameInput').value = names.join('\n');
    drawWheel();
  </script>
</body>
</html>
