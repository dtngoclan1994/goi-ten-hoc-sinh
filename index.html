<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gọi Tên Học Sinh - Bảng Xanh Lớp Học</title>
  <!-- Thư viện hiệu ứng pháo hoa -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Nền không gian lớp học */
      background: radial-gradient(circle, #e2e8f0 0%, #94a3b8 100%);
      padding: 20px;
    }

    .classroom-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Thiết kế Bảng Xanh Lớp Học */
    .blackboard {
      width: 100%;
      min-height: 420px;
      background-color: #0b4f32; /* Màu xanh bảng lớp học */
      border: 16px solid #8b5a2b; /* Khung gỗ */
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4), inset 0 0 50px rgba(0,0,0,0.5);
      position: relative;
      padding: 30px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      justify-content: center;
      gap: 20px;
      overflow: hidden;
    }

    /* Phong cách Chữ Viết Phấn */
    .student-name {
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 0 2px rgba(255,255,255,0.8);
      padding: 8px 16px;
      border-radius: 6px;
      transition: all 0.4s ease;
    }

    /* Khi ẩn các tên còn lại */
    .student-name.hidden-name {
      opacity: 0;
      transform: scale(0.5);
      pointer-events: none;
    }

    /* Hiệu ứng Phóng To, Nổi Bật tên được chọn */
    .student-name.selected-winner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(2.8);
      color: #fef08a; /* Màu phấn vàng rực rỡ */
      text-shadow: 0 0 15px rgba(254, 240, 138, 0.8), 0 0 5px #000;
      z-index: 10;
      white-space: nowrap;
    }

    /* Khung nhập danh sách */
    .controls {
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    textarea {
      width: 100%;
      height: 90px;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      resize: vertical;
      font-size: 1rem;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-update { background-color: #2563eb; }
    .btn-update:hover { background-color: #1d4ed8; }
    
    .btn-spin { background-color: #16a34a; }
    .btn-spin:hover { background-color: #15803d; }
  </style>
</head>
<body>

  <div class="classroom-container">
    <!-- Bảng xanh hiển thị học sinh -->
    <div class="blackboard" id="blackboard"></div>

    <!-- Bảng điều khiển -->
    <div class="controls">
      <label for="nameInput" style="font-weight: bold;">Danh sách học sinh (mỗi tên 1 dòng):</label>
      <textarea id="nameInput" placeholder="Nhập tên học sinh vào đây..."></textarea>
      
      <div class="button-group">
        <button class="btn btn-update" onclick="updateBoard()">Cập Nhật Bảng</button>
        <button class="btn btn-spin" id="spinBtn" onclick="spin()">QUAY CHỌN</button>
      </div>
    </div>
  </div>

  <script>
    let names = ["Nguyễn Văn A", "Trần Thị B", "Lê Văn C", "Phạm Văn D", "Hoàng Thị E", "Đỗ Minh F", "Vũ Hoàng G"];
    let isSpinning = false;

    // Âm thanh vỗ tay tổng hợp (Web Audio API)
    function playClapSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const bufferSize = audioCtx.sampleRate * 1.5; // Độ dài 1.5 giây
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1000;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      noise.start();
    }

    // Âm thanh hiệu ứng chuyển tên ngẫu nhiên
    function playTickSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function updateBoard() {
      const input = document.getElementById('nameInput').value.trim();
      if (input) {
        names = input.split('\n').map(n => n.trim()).filter(n => n !== "");
      }
      renderNames();
    }

    function renderNames() {
      const board = document.getElementById('blackboard');
      board.innerHTML = '';
      names.forEach((name, index) => {
        const div = document.createElement('div');
        div.className = 'student-name';
        div.id = `student-${index}`;
        div.innerText = name;
        board.appendChild(div);
      });
    }

    function spin() {
      if (isSpinning || names.length === 0) return;
      isSpinning = true;

      // Reset hiệu ứng cũ
      renderNames();

      let counter = 0;
      const totalSwaps = 25; // Số lần nháy chọn tên
      const interval = setInterval(() => {
        // Chọn ngẫu nhiên 1 tên để làm nổi bật tạm thời trong lúc quay
        const randomIndex = Math.floor(Math.random() * names.length);
        
        document.querySelectorAll('.student-name').forEach((el, idx) => {
          if (idx === randomIndex) {
            el.style.color = '#fef08a';
            el.style.transform = 'scale(1.2)';
          } else {
            el.style.color = '#ffffff';
            el.style.transform = 'scale(1)';
          }
        });

        playTickSound();
        counter++;

        if (counter >= totalSwaps) {
          clearInterval(interval);
          selectFinalWinner(randomIndex);
        }
      }, 100);
    }

    function selectFinalWinner(winnerIndex) {
      document.querySelectorAll('.student-name').forEach((el, idx) => {
        if (idx === winnerIndex) {
          el.className = 'student-name selected-winner';
        } else {
          el.className = 'student-name hidden-name';
        }
      });

      // Phát hiệu ứng Pháo Hoa
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 }
      });

      // Phát Tiếng Vỗ Tay[cite: 1]
      playClapSound();

      isSpinning = false;
    }

    // Khởi tạo mặc định
    document.getElementById('nameInput').value = names.join('\n');
    renderNames();
  </script>
</body>
</html>
